<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Log Server">
  <defs>
    <linearGradient id="lsbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f7ff0"/>
      <stop offset="1" stop-color="#1b4fa8"/>
    </linearGradient>
  </defs>
  <!-- TOS 规范：底板满铺 512×512、圆角 20%（rx=102），圆角外透明 -->
  <rect x="0" y="0" width="512" height="512" rx="102" fill="url(#lsbg)"/>
  <!-- 图形整体左移 14px，使外接框在画布中水平居中（安全区 ≥68px） -->
  <g transform="translate(-14 0)">
  <!-- 日志行 -->
  <g stroke="#ffffff" stroke-width="26" stroke-linecap="round" opacity="0.95">
    <path d="M124 176h176"/>
    <path d="M124 248h116"/>
    <path d="M124 320h176"/>
  </g>
  <!-- 放大镜（检索） -->
  <circle cx="330" cy="252" r="58" fill="none" stroke="#ffe08a" stroke-width="24"/>
  <path d="M372 294l44 44" fill="none" stroke="#ffe08a" stroke-width="26" stroke-linecap="round"/>
  </g>
</svg>
