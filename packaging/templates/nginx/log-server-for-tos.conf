# log server for TOS — 平台 nginx 反代（External Open / 裸 location）
# 应用只监听 127.0.0.1:15280，不对外开端口。
#
# ★★ 必须用 `^~`（真机血泪，2026-10-14）★★
#   平台自带正则 `location ~ ^/tos(/.*)?`（TOS 桌面路由）会**命中 `/log-server-for-tos/` 的
#   前缀** —— nginx 的正则 location 只要求「命中」，不要求整串匹配，且优先级高于
#   普通前缀 location（不加 ^~ 时请求被桌面抢走：表现为点图标打开了「另一个 TOS 桌面」，
#   服务端返回 301 → /tos/）。真机对照：kavita / alist / piagentfortos / sftpgo /
#   beszelmonitor 全部使用 `^~`；log-server-for-tos 首次应用中心安装即踩中此坑。
location ^~ /log-server-for-tos/ {
    proxy_pass http://127.0.0.1:15280/;    # 结尾的 / 会剥离 /log-server-for-tos/ 前缀
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 实时流（日志跟踪/告警推送）需要 WebSocket
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # 导出大结果集
    proxy_buffering off;
    client_max_body_size 0;
}

# 无尾斜杠的精确匹配 → 相对跳转（`absolute_redirect off` 与 kavita/alist 同做法，
# 否则 nginx 会生成不带端口的绝对 URL）
location = /log-server-for-tos {
    absolute_redirect off;
    return 301 /log-server-for-tos/;
}
